<!doctype html><html><head><style>html,body{margin:0}iframe{position:fixed;inset:0;width:1440px;height:900px;border:0}</style></head><body>
<iframe id="f" src="/"></iframe>
<script>
const f=document.getElementById('f')
const read=(d,w)=>{
  const ws=d.querySelectorAll('.manifesto-lens > h2 .manifesto-word')
  const op=i=>parseFloat(w.getComputedStyle(ws[i]).opacity).toFixed(2)
  return {n:ws.length, first:op(0), mid:op(Math.floor(ws.length/2)), last:op(ws.length-1)}
}
f.onload=()=>setTimeout(()=>{
  const d=f.contentDocument, w=f.contentWindow
  const host=d.querySelector('.manifesto-lens')
  const sec=d.querySelector('.philosophy-manifesto-container')
  const out=[]
  const secTop=sec.getBoundingClientRect().top+w.scrollY
  const secH=sec.getBoundingClientRect().height
  // scroll so the section's centre sits at the viewport centre
  const centred=secTop+secH/2-w.innerHeight/2
  const cases=[['just entering', secTop-w.innerHeight+40],['half way', centred-300],['CENTRED', centred],['past centre', centred+300]]
  let i=0
  const step=()=>{
    if(i>=cases.length){document.body.innerHTML='<pre>'+out.join('\n')+'</pre>';return}
    const [label,y]=cases[i]
    w.scrollTo(0,Math.max(0,y))
    setTimeout(()=>{
      const r=read(d,w)
      out.push(label.padEnd(14)+' scrollY='+Math.round(w.scrollY)+'  words='+r.n+'  first='+r.first+' mid='+r.mid+' last='+r.last)
      i++; step()
    },600)
  }
  step()
},2500)
</script></body></html>
